# ~/.config/foot/foot.ini
# Minimal foot configuration mirroring kitty setup

[main]
include=~/.cache/wal/colors-foot-dark.ini
font=JetBrains Mono Nerd Font:size=13
pad=22x22 center
selection-target=both

[cursor]
style=block
blink=no

[bell]
urgent=yes
notify=yes

[colors-dark]
alpha=1.0

[csd]
# Sway handles borders and titlebars
preferred=none
size=0

[key-bindings]
# Search scrollback (built-in, replaces kitty search.py kitten)
search-start=Control+Shift+f Control+Shift+r

# Page scroll
scrollback-up-page=Shift+Page_Up Page_Up
scrollback-down-page=Shift+Page_Down Page_Down
