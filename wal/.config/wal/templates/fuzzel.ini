[main]
font=JetBrains Mono Nerd Font:size=11
width=42
lines=10
horizontal-pad=12
vertical-pad=10
inner-pad=8
line-height=22
letter-spacing=0
prompt="❯ "
icons-enabled=yes

[colors]
background={background.strip}ee
text={foreground.strip}ff
prompt={color5.strip}ff
placeholder={color8.strip}ff
input={foreground.strip}ff
match={color2.strip}ff
selection={color1.strip}ff
selection-text={background.strip}ff
selection-match={color2.strip}ff
border={color5.strip}ff

[border]
width=2
radius=8
