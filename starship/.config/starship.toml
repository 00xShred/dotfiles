# Starship - Lean / Pure Modern Minimalist Configuration
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Prompt layout: Single inline line
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$rust\
$nodejs\
$java\
$python\
$golang\
$bun\
$kubernetes\
$cmd_duration\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold purple)"
vimcmd_replace_one_symbol = "[❮](bold blue)"
vimcmd_replace_symbol = "[❮](bold blue)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " ~"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bright-black"
format = '([$ahead_behind]($style))([\[$all_status\]]($style) )'
conflicted = "[=${count}](bold red) "
ahead = "[⇡${count}](bold cyan) "
behind = "[⇣${count}](bold magenta) "
diverged = "[⇡${ahead_count}⇣${behind_count}](bold red) "
untracked = "[?${count}](bold blue) "
stashed = "[*${count}](bright-black) "
modified = "[!${count}](bold yellow) "
staged = "[+${count}](bold green) "
renamed = "[»${count}](bold cyan) "
deleted = "[✘${count}](bold red) "

[git_state]
style = "bold yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = "took [$duration]($style) "

# --- Languages & Runtimes (Only shown inside relevant projects) ---
[rust]
symbol = "🦀 "
style = "bold red"
format = "via [$symbol($version)]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version)]($style) "

[java]
symbol = " "
style = "bold yellow"
format = "via [$symbol($version)]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "via [${symbol}${pyenv_prefix}(${version})]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version)]($style) "

[bun]
symbol = "󱥒 "
style = "bold red"
format = "via [$symbol($version)]($style) "

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "bold dimmed blue"
format = "at [$symbol$context( \\($namespace\\))]($style) "

[package]
disabled = true
