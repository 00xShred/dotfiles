# ~/.config/joshuto/joshuto.toml
# Tailored configuration for Kitty + Neovim + Zsh

numbered_command = false
mouse_support = true
focus_on_create = true
use_trash = true
watch_files = true
xdg_open = false
xdg_open_fork = false
case_insensitive_ext = false
zoxide_update = true

[display]
mode = "default"
automatically_count_files = true
collapse_preview = false
column_ratio = [1, 3, 4]
scroll_offset = 6
show_borders = true
show_hidden = false
show_icons = true
line_number_style = "none"
linemode = "size"

[display.sort]
sort_method = "natural"
case_sensitive = false
directories_first = true
reverse = false

[preview]
max_preview_size = "5MB"
preview_script = "~/.config/joshuto/preview_file.sh"

[search]
string_case_sensitivity = "insensitive"
glob_case_sensitivity = "sensitive"
regex_case_sensitivity = "sensitive"
fzf_case_sensitivity = "insensitive"

[tab]
home_page = "home"
