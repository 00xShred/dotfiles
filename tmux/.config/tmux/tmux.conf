# Keyboard-first tmux defaults
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -g history-limit 10000
set -g mouse on
set -g focus-events on
set -g set-clipboard external
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g status-interval 5
set -g status-left '[#S] '
set -g status-left-length 30
set -g status-right '%Y-%m-%d %H:%M'
set -g status-style 'bg=default,fg=colour246'
set -g pane-active-border-style 'fg=colour39'
set -g pane-border-style 'fg=colour238'

# Use tmux's built-in key bindings and prefix.
set -g prefix C-b
bind C-b send-prefix

# Keep automatic titles useful while still allowing explicit names.
setw -g automatic-rename on
setw -g allow-rename on

# Extended keys for Shift+Enter, Ctrl+Enter (CSI-u format)
set -g extended-keys on
set -g extended-keys-format csi-u

# Mouse selection: copy to system clipboard without canceling copy mode (prevents dragging to bottom)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "wl-copy"
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-no-clear "wl-copy" }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-no-clear "wl-copy" }

