# Keyboard-first tmux defaults
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -g history-limit 10000
set -g mouse on
set -g focus-events on
set -g set-clipboard external
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g status-interval 5
set -g status-left '[#S] '
set -g status-left-length 30
set -g status-right '%Y-%m-%d %H:%M'
set -g status-style 'bg=default,fg=colour246'
set -g status-left-style 'fg=colour203,bold'
set -g pane-active-border-style 'fg=colour203'
set -g pane-border-style 'fg=colour238'
set -g message-style 'bg=colour52,fg=colour231'

# Use tmux's built-in key bindings and prefix.
set -g prefix C-b
bind C-b send-prefix

# Keep automatic titles useful while still allowing explicit names.
setw -g automatic-rename on
setw -g allow-rename on
