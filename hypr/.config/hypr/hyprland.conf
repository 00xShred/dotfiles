# hyprland.conf

# ----------------------------------------------------- 
# MONITORS & STARTUP
# ----------------------------------------------------- 

source = ~/.cache/wal/colors-hyprland.conf
monitor=,preferred,auto,1

# crucial for some services
exec-once = uwsm finalize
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Programs to launch on startup (only once)
exec-once = waybar                                                            # status bar
exec-once = dunst                                                             # notification daemon
exec-once = swaybg -i $(cat ~/.cache/wal/wal) -m fill                         # wallpapers
exec-once = nm-applet                                                         # NetworkManager
exec-once = kanshi                                                            # monitor profiles
exec-once = wl-paste --type text --watch cliphist store                       # Stores text data
exec-once = wl-paste --type image --watch cliphist store                      # Stores image data
exec-once = hyprctl setcursor Bibata-Modern-Classic 24                        # cursor theme
exec-once = pkill hyprsunset; hyprsunset -c ~/.config/hypr/hyprsunset.conf    # blue light
exec-once = gnome-keyring-daemon --start --components=secrets                 # keyring auto-login
exec = killall nm-applet; nm-applet --indicator &                             # nm-applet

# ----------------------------------------------------- 
# CORE SETTINGS
# ----------------------------------------------------- 

# Set the 'Super' (Windows) key as the main modifier
$mainMod = SUPER

# Environment variables
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Set the GTK theme, icons, and font
env = GTK_THEME,Breeze-Dark
env = GDK_SCALE,1

# --- CURSOR THEME SETTINGS ---
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# Set the Qt theme (to match GTK)
env = QT_QPA_PLATFORMTHEME,qt5ct

input {
    kb_layout = us
        follow_mouse = 1
        touchpad {
            natural_scroll = yes
        }
}

general {
    gaps_in = 5
        gaps_out = 5
        border_size = 2

# Pywal-controlled border colors
        col.active_border = $color4 
        col.inactive_border = $color8

        layout = dwindle
}

decoration {
    rounding = 3

        active_opacity = 0.95
        inactive_opacity = 0.85
        fullscreen_opacity = 1.0

        blur {
            enabled = true
                size = 3
                passes = 2
        }

    shadow {
        enabled = true
            range = 4
            render_power = 3
            color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes
        bezier = myBezier, 0.05, 0.9, 0.1, 1.05
        animation = windows, 1, 7, myBezier
        animation = windowsOut, 1, 7, default, slide
        animation = border, 1, 10, default
        animation = fade, 1, 7, default
        animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = no 
}

cursor {
    hide_on_key_press = true
        inactive_timeout = 3
}

# -----------------------------------------------------
# KEYBINDS
# -----------------------------------------------------

# Launch Terminal (Super + Enter)
bind = $mainMod, RETURN, exec, kitty

# Launch File Manager (Super + E)
bind = $mainMod, E, exec, nemo

# Launch Terminal File Manager (SUPER + Y)
bind = $mainMod, Y, exec, kitty -e yazi

# Lauch Terminal Email Client (SUPER + A)
bind = $mainMod, A, exec, kitty -e aerc

# Lauch Terminal To-Do (SUPER + T)
bind = $mainMod, T, exec, kitty -e taskwarrior-tui

# Launch Zen Browser (Super + B)
bind = $mainMod, B, exec, zen-browser

#Lauch Qute Browser (Super + Shift + B)
bind = $mainMod SHIFT, B, exec, qutebrowser

#Lauch Qute for the first time (with bitwarden script)
bind = $mainMod SHIFT ALT, B, exec, ~/.scripts/qutebw.sh

# Close Active Window (Super + Q)
bind = $mainMod, Q, killactive, 

# Toggle Fullscreen (Super + F)
bind = $mainMod, F, fullscreen, 

# App Launcher
bind = $mainMod, D, exec, wofi --show drun --lines 3 --width 500 --allow-images --no-actions --prompt ""

# Wallpaper selector
bind = $mainMod, W, exec, kitty --class wallpaper_selector -e "$HOME/.scripts/wallpaper.sh"

# Screenshot (grimblast)
bind = $mainMod, S, exec, grimblast copy area

#Screenshot (grimblast + swappy)
bind = $mainMod SHIFT, S, exec, grimblast save area - | swappy -f -

# Powermenu script
bind = $mainMod, P, exec, ~/.scripts/powermenu.sh

# Monitor management
bind = $mainMod SHIFT, M, exec, nwg-displays

# toggle mute / unmute 
bind = $mainMod, M, exec, ~/.scripts/volume.sh mute

# toggle mic mute / unmute 
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# lock screen -> hyprlock
bind = $mainMod ALT, L, exec, hyprlock

# clipboard history
bind = $mainMod SHIFT, C, exec, ~/.scripts/clipmenu.sh

# quick notes pop-up
bind = $mainMod, N, exec, ~/.scripts/quick_note.sh

# notes search
bind = $mainMod SHIFT, N, exec, kitty --class floating_note ~/.scripts/qn_search.sh

# scrapbook (clip to note)
bind = $mainMod, C, exec, ~/.scripts/clip_to_note.sh

# ----------------------------------------------------- 
# ESSENTIAL SYSTEM & NAVIGATION KEYBINDS
# ----------------------------------------------------- 

# Exit Hyprland Session (Super + Shift + E)
bind = $mainMod SHIFT, E, exit, 

# Reload Hyprland Config (Super + R)
bind = $mainMod, R, exec, hyprctl reload

# Move focus (Super + Arrow Keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
gesture = 3, horizontal, workspace

# Switch Workspaces (Super + 1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace (Super + Shift + 1-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# --- Window & Workspace Switching ---
# ALT + TAB: Switch between windows in the current workspace
bind = ALT, TAB, cyclenext
bind = ALT SHIFT, TAB, cyclenext, prev

# SUPER + TAB: Switch to the most recent workspace
bind = $mainMod, TAB, workspace, previous


# --- Resize Tiled Windows ---
# Uses SUPER + CTRL + [Vim Keys] to resize
bind = $mainMod CTRL, H, resizeactive, -20 0
bind = $mainMod CTRL, L, resizeactive, 20 0
bind = $mainMod CTRL, K, resizeactive, 0 -20
bind = $mainMod CTRL, J, resizeactive, 0 20

# --- Move Focus (Vim Keys) ---
# Move focus between tiled windows
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# --- Move (Swap) Tiled Windows ---
# Swap the active window with another
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

# --- Floating Window Controls ---

# SUPER + V: Toggle a window to be floating
bind = $mainMod, V, togglefloating

# SUPER + Left-Click-Drag: Move a floating window
bindm = $mainMod, mouse:272, movewindow

# SUPER + Right-Click-Drag: Resize a floating window
bindm = $mainMod, mouse:273, resizewindow

# --- Window/Mouse Controls ---
# Move/Resize windows with Super + Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Laptop Lid Rules ---
# Disable laptop screen when lid is closed
bindl = , switch:L_LID_SW, exec, hyprctl keyword monitor "eDP-1, disable"

# Enable laptop screen when lid is opened
bindl = , switch:L_LID_SW, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1"

# ----------------------------------------------------- 
# VOLUME & BRIGHTNESS CONTROLS
# ----------------------------------------------------- 
# Volume (uses script)
bindl= , XF86AudioRaiseVolume, exec, ~/.scripts/volume.sh up
bindl= , XF86AudioLowerVolume, exec, ~/.scripts/volume.sh down
bindl= , XF86AudioMute, exec, ~/.scripts/volume.sh mute

# Brightness (uses script)
bindl= , XF86MonBrightnessUp, exec, ~/.scripts/brightness.sh up
bindl= , XF86MonBrightnessDown, exec, ~/.scripts/brightness.sh down

# ----------------------------------------------------- 
# WINDOW & LAYER RULES
# ----------------------------------------------------- 

# Glow
     windowrule {
         name = glow-popover
             match:title = ^(glow)$
             float = on
             size = 900 600
             center = on
             pin = on
             move = (cursor_x) (cursor_y)
     }

# Wallpaper Selector
windowrule {
    name = wallpaper-picker
        match:class = ^(wallpaper_selector)$
        float = on
        size = 800 500
        center = on
}

# System UI Layer Rules
layerrule {
    name = waybar-blur
        match:namespace = waybar
}

layerrule {
    name = wofi-style
        match:namespace = wofi
        blur = on
        dim_around = on
}

# Quick Notes
windowrule {
    name = quick-note-popover
        match:class = ^(floating_note)$
        float = on
        size = 900 600
        center = on
        pin = on
}


# this gamin shi
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
